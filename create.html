
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スレッドを作成 | COMMUNITY BOARD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="header-inner">
            <h1>COMMUNITY BOARD</h1>
            <p>誰でも自由に話せる匿名掲示板</p>
        </div>
    </header>

    <main class="container">

        <!-- スレッド作成フォーム -->
        <section class="post-section">

            <h2>スレッドを作成</h2>

            <form id="threadForm">

                <label for="threadTitle">タイトル</label>

                <input
                    type="text"
                    id="threadTitle"
                    placeholder="スレッドのタイトル"
                    maxlength="100"
                    required
                >

                <label for="threadCategory">カテゴリー</label>

                <select id="threadCategory" required>
                    <option value="雑談">雑談</option>
                    <option value="質問">質問</option>
                    <option value="趣味">趣味</option>
                    <option value="ニュース">ニュース</option>
                    <option value="その他">その他</option>
                </select>

                <label for="threadContent">本文</label>

                <textarea
                    id="threadContent"
                    placeholder="自由に投稿してください"
                    maxlength="5000"
                    required
                ></textarea>

                <label for="threadImage">画像を添付（任意・最大8MB）</label>

                <input
                    type="file"
                    id="threadImage"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                >

                <p>対応形式：JPEG・PNG・WEBP・GIF（1枚8MBまで）</p>

                <div id="imagePreview"></div>

                <button type="submit" id="submitThread">
                    スレッドを投稿する
                </button>

            </form>

            <p>
                <a href="index.html">← スレッド一覧に戻る</a>
            </p>

        </section>

    </main>

    <!-- フッター -->
    <footer class="footer">
        <p>COMMUNITY BOARD</p>
        <p>Anonymous Community</p>
    </footer>

    <!-- Supabaseライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- データ管理 -->
    <script src="works.js"></script>

    <!-- スレッド作成処理 -->
    <script>

        const form = document.getElementById("threadForm");
        const imageInput = document.getElementById("threadImage");
        const preview = document.getElementById("imagePreview");
        const submitButton = document.getElementById("submitThread");

        // ====================================
        // 画像設定
        // ====================================

        const MAX_IMAGE_SIZE = 8 * 1024 * 1024;

        const ALLOWED_TYPES = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];

        // ====================================
        // 画像読み込み
        // ====================================

        function readImage(file) {

            return new Promise((resolve, reject) => {

                if (!file) {
                    resolve(null);
                    return;
                }

                if (!ALLOWED_TYPES.includes(file.type)) {
                    reject(new Error(
                        "JPEG、PNG、WEBP、GIF画像を選択してください。"
                    ));
                    return;
                }

                if (file.size > MAX_IMAGE_SIZE) {
                    reject(new Error(
                        "画像サイズは8MB以下にしてください。"
                    ));
                    return;
                }

                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);

                reader.onerror = () => reject(
                    new Error("画像を読み込めませんでした。")
                );

                reader.readAsDataURL(file);

            });
        }

        // ====================================
        // 画像プレビュー
        // ====================================

        imageInput.addEventListener("change", async () => {

            preview.innerHTML = "";

            const file = imageInput.files[0];

            if (!file) return;

            try {

                const image = await readImage(file);

                const img = document.createElement("img");

                img.src = image;
                img.alt = "画像プレビュー";

                preview.appendChild(img);

            } catch (error) {

                alert(error.message);
                imageInput.value = "";
                preview.innerHTML = "";

            }

        });

        // ====================================
        // スレッド投稿
        // ====================================

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const title = document.getElementById("threadTitle")
                .value.trim();

            const category = document.getElementById("threadCategory")
                .value;

            const content = document.getElementById("threadContent")
                .value.trim();

            const imageFile = imageInput.files[0];

            if (!title || !content) {
                alert("タイトルと本文を入力してください。");
                return;
            }

            if (!Works.isConnected()) {
                alert("データベースに接続できません。接続設定を確認してください。");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "投稿中...";

            try {

                const image = await readImage(imageFile);

                const newThread = await Works.createThread({
                    title,
                    category,
                    content,
                    image
                });

                if (!newThread) {
                    throw new Error(
                        "投稿を保存できませんでした。時間をおいて再度お試しください。"
                    );
                }

                alert("スレッドを投稿しました！");

                window.location.href =
                    "index.html?thread=" +
                    encodeURIComponent(newThread.id);

            } catch (error) {

                console.error("投稿エラー:", error);

                alert(error.message || "投稿に失敗しました。");

            } finally {

                submitButton.disabled = false;
                submitButton.textContent = "スレッドを投稿する";

            }

        });

    </script>

</body>
</html>
